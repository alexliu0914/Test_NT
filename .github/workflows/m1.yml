# M1 基礎平台：任何失敗、中止、輪數不足或結果檔缺失都會讓工作失敗（與 M0 相同的執行器規則）
name: m1-app
on:
  push:
    paths: ['app/**', '.github/workflows/m1.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/m1.yml']
  workflow_dispatch:
    inputs:
      full:
        description: '完整輪數＋變異測試'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        working-directory: app
        shell: bash
    env:
      PGHOST: 127.0.0.1
      PGPORT: '54329'
      PGUSER: postgres
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:54329/notes_test
      DATABASE_URL: postgres://postgres@127.0.0.1:54329/notes_test
      # 建置時使用的設定（不是秘密；測試執行時每次另外隨機產生秘密值）
      COLLAB_PUBLIC_URL: ws://127.0.0.1:27601
      BETTER_AUTH_URL: http://127.0.0.1:27600
      BETTER_AUTH_SECRET: build-time-placeholder-not-used-at-runtime-000
      COLLAB_SECRET: build-time-placeholder-not-used-at-runtime-000
      FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
      BASH_ENV: ${{ github.workspace }}/prototype/scripts/ci-annotate.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: 啟動測試資料庫
        run: ann docker compose -f docker-compose.test.yml up -d --wait
      - name: 建立測試資料庫（notes_test，C.UTF-8，含測試標記）
        run: ann bash test/setup-test-db.sh
      - name: 安裝套件（依 lockfile）
        run: |
          ann npm ci
          ann npx playwright install --with-deps chromium
      - name: 套件漏洞掃描（正式相依套件不得有高風險漏洞，SEC-09）
        run: ann npm audit --omit=dev --audit-level=high
      - name: 型別檢查與建置
        run: |
          ann npx tsc --noEmit
          ann npx next build
      - name: 執行器自我測試
        run: ann node test/runner-selftest.mjs
      - name: 認證、安全、頁面樹、遷移
        run: |
          if [ "$FULL" = "true" ]; then
            ann node test/run.js MIG-01=3 AUTH-01=10 AUTH-02=10 AUTH-03=10 AUTH-04=10 AUTH-05=9 AUTH-06=10 AUTH-07=10 SEC-01=5 SEC-02=20 SEC-03=3 SEC-05=3 SEC-06=10 PAGE-01=20 PAGE-02=20 PAGE-03=10 PAGE-04=5 PAGE-05=30
          else
            ann node test/run.js MIG-01=1 AUTH-01=2 AUTH-02=2 AUTH-03=2 AUTH-04=2 AUTH-05=2 AUTH-06=2 AUTH-07=2 SEC-01=1 SEC-02=3 SEC-03=1 SEC-05=1 SEC-06=2 PAGE-01=3 PAGE-02=3 PAGE-03=2 PAGE-04=1 PAGE-05=3
          fi
          cp results/summary.json results/summary-m1.json
      - name: 協作核心（M0-01～11、M0-17，在正式協作伺服器上）
        run: |
          if [ "$FULL" = "true" ]; then
            ann node test/run.js M0-01=100 M0-02=100 M0-03=100 M0-04=100 M0-05=100 M0-06=100 M0-07=100 M0-08=100 M0-09=40 M0-10=25 M0-11=100 M0-17=30
          else
            ann node test/run.js M0-01=10 M0-02=5 M0-03=10 M0-04=10 M0-05=10 M0-06=10 M0-07=10 M0-08=10 M0-09=2 M0-10=2 M0-11=10 M0-17=3
          fi
          cp results/summary.json results/summary-core.json
      - name: 瀏覽器（正式網頁與登入）
        run: |
          if [ "$FULL" = "true" ]; then ann node test/run.js BR-01=20 BR-02=20 BR-03=5; else ann node test/run.js BR-01=2 BR-02=2 BR-03=1; fi
          cp results/summary.json results/summary-browser.json
      - name: 變異測試（完整執行時）
        if: env.FULL == 'true'
        run: ann python3 test/mutations.py
      - name: 上傳結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-results-${{ github.sha }}
          path: app/results/
