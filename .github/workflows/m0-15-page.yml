# 以正式 UI（@blocknote/mantine）打包 M0-15 手機測試頁，自動冒煙測試後推到 build/m0-15 分支，供發布為手機測試頁
name: m0-15-mobile-page
on:
  push:
    paths: ['prototype/web/mobile*', 'prototype/src/blocknote-schema.js', 'prototype/scripts/build-mobile.sh', 'prototype/test/browser/mobile-smoke.mjs', '.github/workflows/m0-15-page.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: prototype
        shell: bash
    env:
      # 失敗時把輸出最後一段寫成註解（可經 API 讀取）
      BASH_ENV: ${{ github.workspace }}/prototype/scripts/ci-annotate.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: 安裝套件（lockfile＋固定版本的 UI 套件）
        run: |
          ann npm ci
          ann npm install --no-save --ignore-scripts @blocknote/react@0.56.0 @blocknote/mantine@0.56.0 react@19.3.1 react-dom@19.3.1 esbuild@0.28.2 playwright@1.63.0
          ann npx playwright install --with-deps chromium
          npm ls @blocknote/react @blocknote/mantine @mantine/core @mantine/hooks react react-dom esbuild playwright --depth=1 > results-versions.txt || true
          cat results-versions.txt
      - name: 打包（mantine 與 core）
        run: |
          export ESBUILD=node_modules/.bin/esbuild
          ann bash scripts/build-mobile.sh mantine
          ann bash scripts/build-mobile.sh core
      - name: 冒煙測試
        run: |
          ann node test/browser/mobile-smoke.mjs web/dist/m0-15-mantine.html
          ann node test/browser/mobile-smoke.mjs web/dist/m0-15-core.html
      - name: 推到 build/m0-15 分支
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT="$RUNNER_TEMP/m015"
          mkdir -p "$OUT"
          cp web/dist/m0-15-mantine.html web/dist/m0-15-core.html results-versions.txt results/m0-15-* "$OUT"/
          cd "$OUT"
          printf 'source: %s\nrun: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > SOURCE.txt
          git init -q -b build/m0-15
          git add .
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "M0-15 手機測試頁 build from $GITHUB_SHA"
          ann git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build/m0-15
